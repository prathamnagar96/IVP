[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ewp-phase1-macro-risk-screening"
version = "1.0.0"
description = "Phase 1 Macro-Risk Screening & Priority Queue for Landslide Early Warning Platform"
authors = [{name = "Antigravity Engineering"}]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.2",
    "xgboost>=1.7",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "jsonschema>=4.17",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --strict-markers"
