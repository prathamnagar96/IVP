[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ewp-phase2b-drone-inspection"
version = "1.0.0"
description = "Phase 2B targeted drone inspection and 3D change detection"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "jsonschema>=4.17",
    "pyyaml>=6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "planner"]
addopts = "-v --strict-markers"
