[project]
name = "jobradar"
version = "1.0.0"
description = "JobRadar API - Remote SWE jobs at funded startups via ATS APIs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0,<0.28",
    "supabase>=2.3.0,<3.0",
    "aiosqlite>=0.10.0,<0.11",
    "fastapi>=0.112.0,<0.113",
    "uvicorn[standard]>=0.30.0,<0.31",
    "pydantic>=2.8.0,<3.0",
    "pydantic-settings>=2.3.0,<3.0",
    "python-dotenv>=1.0.0,<2.0",
    "pyyaml>=6.0.1,<7.0",
    "beautifulsoup4>=4.12.0,<5.0",
    "lxml>=5.2.0,<6.0",
    "playwright>=1.45.0,<2.0",
    "tenacity>=8.3.0,<9.0",
    "structlog>=24.1.0,<25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0,<9.0",
    "pytest-asyncio>=0.23.0,<1.0",
    "pytest-cov>=5.0.0,<6.0",
    "httpx[test]>=0.27.0,<0.28",
    "faker>=24.0.0,<25.0",
    "ruff>=0.5.0,<1.0",
    "mypy>=1.11.0,<2.0",
]

[build-system]
requires = ["setuptools>=70.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py311"
lint.select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "T20", "ARG", "PTH"]
lint.ignore = ["S101", "ARG001", "ARG002"]
format.quote-style = "double"
format.indent-style = "space"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.setuptools.packages.find]
where = ["."]
include = ["jobradar*"]