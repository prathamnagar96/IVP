# JobRadar Source Registry
# Each entry maps a company to its ATS provider and board token
# Add new sources here - no code changes required
# Fields:
#   company: Display name of the company
#   ats: One of "greenhouse", "lever", "ashby", "workable", "scrape"
#   token: The board identifier used in the ATS API URL
#   enabled: Whether to include this source in sync runs (default: true)
#   scrape_selectors: Required only for ats: scrape - CSS selectors for job data
#   tags: Optional tags to categorize this source
#   notes: Internal notes (e.g., ToS review date, special handling)

